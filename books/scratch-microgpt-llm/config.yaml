title: "Scratch 3 で作って動かす小さな LLM：microGPT のなかみを1手ずつ"
summary: |
  拡張機能なし（ペンだけ）の Scratch 3 で、小さな GPT（microGPT）を丸ごと組み上げます。
  トークン化・埋め込み・アテンション・MLP・出力・サンプリング・自己回帰生成、そして学習（誤差逆伝播と Adam）まで、
  実際に動く俳句生成モデルの画面を1手ずつ追いながら解説します。
  数式と Scratch のブロックを1つずつ対応させ、LLM が中で何をしているのかを目で確かめられる本です。

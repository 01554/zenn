title: "AGI時代の好き本位体制 子どもの道は、代わりに歩けない"
summary: "AGIが人間の知的な仕事の大半を担う時代に、小学生の親は子どもの「好き」とどう付き合うか。好きは完成品ではなく、歩いてできる道だという見方から、家庭でやれることと、学校とAGIの時代に親が確かめることを書いた本の全文です。序章・第1章・参考資料1(デンマークのデジタル教育改革の検証)・参考文献は無料で読めます。"
